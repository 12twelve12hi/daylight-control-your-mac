# Monorepo CI for whiteboard-camera/ (the future standalone repo root). Identical to
# whiteboard-camera/.github/workflows/ci.yml plus path filters and working-directory: whiteboard-camera.
name: whiteboard-camera

on:
  push:
    branches: ['claude/**', 'master']
    tags: ['v*']   # notarization path (SPEC D22); GitHub ignores paths: for tag pushes, which is intended
    paths:
      - 'whiteboard-camera/**'
      - '.github/workflows/whiteboard-camera.yml'
  pull_request:
    paths:
      - 'whiteboard-camera/**'
      - '.github/workflows/whiteboard-camera.yml'
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the signed build (needs the ASC_* secrets)
        type: boolean
        default: false

# Concurrency is per job (LOOSE_ENDS B16): the Linux jobs cancel their older runs for fast feedback; a mac job
# that has started always finishes, with at most one newer mac job waiting behind it.
defaults:
  run:
    working-directory: whiteboard-camera

jobs:
  golden:
    runs-on: ubuntu-latest
    concurrency:
      group: wbc-golden-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-env.sh
      - run: make golden-check
      - run: make scripts-check

  web:
    runs-on: ubuntu-latest
    concurrency:
      group: wbc-web-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whiteboard-camera/web/package-lock.json
      - run: scripts/ci-env.sh
      - run: make web
      - run: make web-test
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: whiteboard-camera/web/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: whiteboard-camera/web/playwright-report
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    concurrency:
      group: wbc-android-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/ci-env.sh
      - run: make android
      - uses: actions/upload-artifact@v7
        with:
          name: daylight-ink-debug-apk
          path: whiteboard-camera/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: whiteboard-camera/android/app/build/reports
          if-no-files-found: ignore

  kit-linux:
    runs-on: ubuntu-latest
    concurrency:
      group: wbc-kit-linux-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 20
    container: swift:6.4-noble   # the official image has no make or python3, so the scripts run directly
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-env.sh
      - run: scripts/kit-test.sh

  mac:
    runs-on: macos-15
    concurrency:
      group: wbc-mac-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 60
    needs: [golden, web, kit-linux, android]
    env:
      # scripts/mac-release.sh exits 1 when these say a set exists but a name is missing in its own env (a misnamed secret).
      HAS_SIGNING: ${{ secrets.DAYLIGHT_DEVELOPER_ID_P12_BASE64 != '' && secrets.DAYLIGHT_DEVELOPER_ID_P12_PASSWORD != '' && secrets.DAYLIGHT_APP_PROVISIONING_PROFILE_BASE64 != '' && secrets.DAYLIGHT_TEAM_ID != '' }}
      NOTARIZE_REQUESTED: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.notarize == true }}
      DO_NOTARIZE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.notarize == true) && secrets.ASC_API_PRIVATE_KEY_BASE64 != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      # Optional repository variable to build with another installed Xcode (ARCHITECTURE 9.2); ci-env.sh checks the
      # path exists and writes DEVELOPER_DIR to GITHUB_ENV for the later steps.
      DAYLIGHT_XCODE_PATH: ${{ vars.DAYLIGHT_XCODE_PATH }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whiteboard-camera/web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: daylight-ink-debug-apk
          path: whiteboard-camera/android/app/build/outputs/apk/debug
      - run: brew install xcodegen
      - run: scripts/ci-env.sh
      - run: make fetch-tools
      - run: make embed-apk
      - run: make web
      - run: make mac-generate
      - run: make kit-test
      - run: make mac-debug
      - run: make mac-test
      - run: make mac-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: Daylight-unsigned
          path: whiteboard-camera/build/Daylight-unsigned.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xcodebuild-logs
          path: whiteboard-camera/build/xcodebuild-logs
          if-no-files-found: ignore
      - name: Signed and notarized build (skips itself without secrets)
        run: make mac-release
        env:
          DAYLIGHT_TEAM_ID: ${{ secrets.DAYLIGHT_TEAM_ID }}
          DAYLIGHT_DEVELOPER_ID_P12_BASE64: ${{ secrets.DAYLIGHT_DEVELOPER_ID_P12_BASE64 }}
          DAYLIGHT_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DAYLIGHT_DEVELOPER_ID_P12_PASSWORD }}
          DAYLIGHT_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.DAYLIGHT_APP_PROVISIONING_PROFILE_BASE64 }}
          DAYLIGHT_EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.DAYLIGHT_EXT_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
      # The logs leave the runner even when mac-release fails (archive.log, export.log, identities, codesign,
      # profile-check, notarytool-submit.json/.err, notarization-log.json); the binaries must exist when signing ran.
      - uses: actions/upload-artifact@v7
        if: always() && env.HAS_SIGNING == 'true'
        with:
          name: release-logs
          path: whiteboard-camera/build/release-logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: env.HAS_SIGNING == 'true'
        with:
          name: Daylight-signed
          path: whiteboard-camera/build/Daylight-signed.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: env.HAS_SIGNING == 'true' && env.DO_NOTARIZE == 'true'
        with:
          name: Daylight-dmg
          path: whiteboard-camera/build/Daylight.dmg
          if-no-files-found: error
          compression-level: 0
