# Standalone CI for the whiteboard-camera repository (every step is a make target; scripts/ holds the logic).
# The monorepo twin is /.github/workflows/whiteboard-camera.yml with working-directory and path filters added.
name: ci

on:
  push:
    branches: ['claude/**', 'master', 'main']
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the signed build (needs the ASC_* secrets)
        type: boolean
        default: false

concurrency:
  group: wbc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-env.sh
      - run: make golden-check

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/ci-env.sh
      - run: make web
      - run: make web-test
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/ci-env.sh
      - run: make android
      - uses: actions/upload-artifact@v7
        with:
          name: daylight-ink-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports
          if-no-files-found: ignore

  kit-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4-noble   # the official image has no make or python3, so the scripts run directly
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-env.sh
      - run: scripts/kit-test.sh

  mac:
    runs-on: macos-15
    timeout-minutes: 60
    needs: [golden, web, kit-linux]
    env:
      HAS_SIGNING: ${{ secrets.DAYLIGHT_DEVELOPER_ID_P12_BASE64 != '' && secrets.DAYLIGHT_APP_PROVISIONING_PROFILE_BASE64 != '' && secrets.DAYLIGHT_TEAM_ID != '' }}
      DO_NOTARIZE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.notarize == true) && secrets.ASC_API_PRIVATE_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install xcodegen
      - run: scripts/ci-env.sh
      - run: make web
      - run: make mac-generate
      - run: make kit-test
      - run: make mac-debug
      - uses: actions/upload-artifact@v7
        with:
          name: Daylight-unsigned
          path: build/Daylight-unsigned.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xcodebuild-logs
          path: build/xcodebuild-logs
          if-no-files-found: ignore
      - name: Signed and notarized build (skips itself without secrets)
        run: make mac-release
        env:
          DAYLIGHT_TEAM_ID: ${{ secrets.DAYLIGHT_TEAM_ID }}
          DAYLIGHT_DEVELOPER_ID_P12_BASE64: ${{ secrets.DAYLIGHT_DEVELOPER_ID_P12_BASE64 }}
          DAYLIGHT_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DAYLIGHT_DEVELOPER_ID_P12_PASSWORD }}
          DAYLIGHT_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.DAYLIGHT_APP_PROVISIONING_PROFILE_BASE64 }}
          DAYLIGHT_EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.DAYLIGHT_EXT_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
      - uses: actions/upload-artifact@v7
        if: env.HAS_SIGNING == 'true'
        with:
          name: Daylight-signed
          path: |
            build/Daylight-signed.zip
            build/Daylight.dmg
            build/notarization-log.json
            build/release-logs
          if-no-files-found: ignore
          compression-level: 0
