# Standalone CI for the whiteboard-camera repository (every step is a make target; scripts/ holds the logic).
# The monorepo twin is /.github/workflows/whiteboard-camera.yml with working-directory and path filters added.
name: ci

on:
  push:
    branches: ['claude/**', 'master', 'main']
    tags: ['v*']   # notarization path (SPEC D22)
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the signed build (needs the ASC_* secrets)
        type: boolean
        default: false

# Concurrency is per job (LOOSE_ENDS B16): the Linux jobs cancel their older runs for fast feedback; a mac job
# that has started always finishes, with at most one newer mac job waiting behind it.
jobs:
  golden:
    runs-on: ubuntu-latest
    concurrency:
      group: wbc-golden-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-env.sh
      - run: make golden-check
      - run: make fuzz-check
      - run: make scripts-check

  web:
    runs-on: ubuntu-latest
    concurrency:
      group: wbc-web-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/ci-env.sh
      - run: make web
      - run: make web-test
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    concurrency:
      group: wbc-android-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/ci-env.sh
      - run: make android
      - uses: actions/upload-artifact@v7
        with:
          name: daylight-ink-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports
          if-no-files-found: ignore

  kit-linux:
    runs-on: ubuntu-latest
    concurrency:
      group: wbc-kit-linux-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 20
    container: swift:6.4-noble   # the official image has no make or python3, so the scripts run directly
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-env.sh
      - run: scripts/kit-test.sh

  mac:
    runs-on: macos-15
    concurrency:
      group: wbc-mac-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 60
    needs: [golden, web, kit-linux, android]
    env:
      # scripts/mac-release.sh treats these as a partial or misnamed set when a name is missing in its own env: exit 1 on a
      # tag or notarize run, a ::warning:: and exit 0 on an ordinary push.
      HAS_SIGNING: ${{ secrets.DAYLIGHT_DEVELOPER_ID_P12_BASE64 != '' && secrets.DAYLIGHT_DEVELOPER_ID_P12_PASSWORD != '' && secrets.DAYLIGHT_APP_PROVISIONING_PROFILE_BASE64 != '' && secrets.DAYLIGHT_TEAM_ID != '' }}
      NOTARIZE_REQUESTED: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.notarize == true }}
      DO_NOTARIZE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.notarize == true) && secrets.ASC_API_PRIVATE_KEY_BASE64 != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      # Optional repository variable to build with another installed Xcode (ARCHITECTURE 9.2); ci-env.sh checks the
      # path exists and writes DEVELOPER_DIR to GITHUB_ENV for the later steps.
      DAYLIGHT_XCODE_PATH: ${{ vars.DAYLIGHT_XCODE_PATH }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: daylight-ink-debug-apk
          path: android/app/build/outputs/apk/debug
      - run: brew install xcodegen
      - run: scripts/ci-env.sh
      - run: make fetch-tools
      - run: make embed-apk
      - run: make web
      - run: make mac-generate
      - run: make kit-test
      - run: make mac-debug
      - run: make mac-test
      - run: make mac-smoke
      # VP Mac UI (docs/handoff/vp-mac-ui.md): XCUITest pass over every surface in light and dark with screenshots
      # and the docs-to-UI strings; non-blocking until it has been green three times in a row. Before the
      # xcodebuild-logs upload below so build/xcodebuild-logs/ui-test.log is in that artifact.
      - name: UI test suite (non-blocking until green three times)
        continue-on-error: true
        timeout-minutes: 12
        run: make mac-ui-test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-screenshots
          path: build/ui-screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: Daylight-unsigned
          path: build/Daylight-unsigned.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xcodebuild-logs
          path: build/xcodebuild-logs
          if-no-files-found: ignore
      - name: Signed and notarized build (skips itself without secrets)
        run: make mac-release
        env:
          DAYLIGHT_TEAM_ID: ${{ secrets.DAYLIGHT_TEAM_ID }}
          DAYLIGHT_DEVELOPER_ID_P12_BASE64: ${{ secrets.DAYLIGHT_DEVELOPER_ID_P12_BASE64 }}
          DAYLIGHT_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DAYLIGHT_DEVELOPER_ID_P12_PASSWORD }}
          DAYLIGHT_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.DAYLIGHT_APP_PROVISIONING_PROFILE_BASE64 }}
          DAYLIGHT_EXT_PROVISIONING_PROFILE_BASE64: ${{ secrets.DAYLIGHT_EXT_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
      # The logs leave the runner even when mac-release fails (archive.log, export.log, identities, codesign,
      # profile-check, notarytool-submit.json/.err, notarization-log.json); the binaries must exist when signing ran.
      - uses: actions/upload-artifact@v7
        if: always() && env.HAS_SIGNING == 'true'
        with:
          name: release-logs
          path: build/release-logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: env.HAS_SIGNING == 'true'
        with:
          name: Daylight-signed
          path: build/Daylight-signed.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: env.HAS_SIGNING == 'true' && env.DO_NOTARIZE == 'true'
        with:
          name: Daylight-dmg
          path: build/Daylight.dmg
          if-no-files-found: error
          compression-level: 0

  # LOOSE_ENDS H2: the same build and tests on the GitHub-hosted macOS 26 image (label macos-26, GA in the
  # actions/runner-images README, Arm64, its default Xcode). Non-blocking: continue-on-error keeps a red leg from failing
  # the run; macos-15 above stays the required leg until this one has been green for a week. No signing step here.
  mac-26:
    runs-on: macos-26
    continue-on-error: true
    concurrency:
      group: wbc-mac26-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 60
    needs: [golden, web, kit-linux, android]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: daylight-ink-debug-apk
          path: android/app/build/outputs/apk/debug
      - run: brew install xcodegen
      - run: scripts/ci-env.sh
      - run: make fetch-tools
      - run: make embed-apk
      - run: make web
      - run: make mac-generate
      - run: make kit-test
      - run: make mac-debug
      - run: make mac-test
      - run: make mac-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: Daylight-unsigned-macos-26
          path: build/Daylight-unsigned.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xcodebuild-logs-macos-26
          path: build/xcodebuild-logs
          if-no-files-found: ignore

  # Instrumented tests of Daylight Ink on an emulated Android 13 tablet shaped like the Daylight DC-1 (docs/SCREENSHOTS.md):
  # API 33 google_apis x86_64 on the "Nexus 10" profile, forced to 1200x1600 at 200 dpi by scripts/android-emulator.sh.
  # Uses reactivecircus/android-emulator-runner@v2 with its README's KVM step and AVD snapshot cache recipe. Non-blocking
  # for now: continue-on-error keeps a red run from failing the workflow; it is promoted to blocking after three green
  # runs in a row. No other job needs it.
  android-emulator:
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: wbc-android-emulator-${{ github.ref }}
      # Like the mac job: a started run finishes (the emulator needs about 20 minutes and the branch takes pushes from
      # several teams), with at most one newer run waiting behind it.
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: scripts/ci-env.sh
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Both APKs exist before the emulator boots, so the emulator's minutes go to the tests only.
      - run: make android-emulator-build
      # Bump the trailing -r1 whenever an emulator-runner input below or the avd-config phase of the script changes.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-33-google_apis-x86_64-nexus10-r1
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 10
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          pre-emulator-launch-script: scripts/android-emulator.sh avd-config
          script: echo "Generated AVD snapshot for caching."
      # The action runs each script line separately with sh -c, in working-directory, with ANDROID_SERIAL set.
      - name: Instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 10
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          pre-emulator-launch-script: scripts/android-emulator.sh avd-config
          script: make android-emulator
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: build/android-emulator
          if-no-files-found: warn
