# Finish a notarization that outran the mac job of ci.yml (docs/SIGNING.md, "A slow notarization"). Dispatch it with
# the submission id from the mac job's "notarization submission <id>" notice (also release-logs/notary-submission-id.txt
# and NOTARIZATION-PENDING.txt) and the id of that run; it waits for Apple, downloads that run's Daylight-dmg-pending,
# staples the DMG and uploads it as Daylight-dmg. The monorepo twin is /.github/workflows/whiteboard-camera-notary.yml.
name: notary

on:
  # A dispatch-only workflow is registered by GitHub only once a run of it exists (or it sits on the default branch),
  # so a push that touches it runs the Linux gate below, which registers the workflow for the dispatch button and
  # `gh workflow run`; the macOS job runs on dispatch only.
  push:
    branches: ['claude/**', 'master', 'main']
    paths:
      - '.github/workflows/notary.yml'
      - 'scripts/notary-resume.sh'
  workflow_dispatch:
    inputs:
      submission_id:
        description: Notary submission id (UUID) printed by the mac job
        type: string
        required: true
      source_run_id:
        description: Run id whose Daylight-dmg-pending artifact holds the submitted DMG (empty = report status only)
        type: string
        default: ''

permissions:
  contents: read
  actions: read   # gh run download of the pending DMG

jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The script's gate without Apple tools: nothing set exits 1 naming the gap; a complete set stops in check-only mode.
      - run: |
          if scripts/notary-resume.sh; then echo "gate: expected exit 1 with nothing set"; exit 1; fi
          ASC_API_KEY_ID=KEY ASC_API_ISSUER_ID=ISSUER ASC_API_PRIVATE_KEY_BASE64=cDg= \
            NOTARY_SUBMISSION_ID=00000000-0000-0000-0000-000000000000 DAYLIGHT_RELEASE_CHECK_ONLY=1 scripts/notary-resume.sh
  notary:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Wait for Apple, staple the submitted DMG
        run: scripts/notary-resume.sh
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          NOTARY_SUBMISSION_ID: ${{ inputs.submission_id }}
          NOTARY_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-logs
          path: build/release-logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: hashFiles('build/release-logs/stapled.ok') != ''
        with:
          name: Daylight-dmg
          path: build/Daylight.dmg
          if-no-files-found: error
          compression-level: 0
