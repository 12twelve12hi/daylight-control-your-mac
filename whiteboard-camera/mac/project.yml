# XcodeGen spec for the Daylight menu-bar app and its CMIO camera extension.
# Generated by `make mac-generate` (scripts/mac-generate.sh exports every ${VAR} used here).
# Facts: docs/ARCHITECTURE.md section 10 and the research note research-cmio-signing (OBS, OffcutsCam, XcodeGen ProjectSpec).
name: Daylight
options:
  bundleIdPrefix: com.twelve
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ${DAYLIGHT_TEAM_ID}
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: ${DAYLIGHT_MARKETING_VERSION}
    CURRENT_PROJECT_VERSION: ${DAYLIGHT_BUILD_NUMBER}
    GENERATE_INFOPLIST_FILE: YES
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  DaylightKit:
    path: DaylightKit
targets:
  Daylight:
    type: application
    platform: macOS
    sources:
      - path: Daylight/Sources
      - path: Daylight/Resources/web
        type: folder
        buildPhase: resources
      # Bundled adb + scrcpy-server (make fetch-tools); copied as a folder reference to Contents/Resources/Vendor/.
      # scripts/mac-generate.sh creates the directory with a README.txt when it is missing so the reference resolves.
      - path: Daylight/Resources/Vendor
        type: folder
        buildPhase: resources
      # Daylight Ink debug APK (make embed-apk, SPEC D43). A directory without an extension is an XcodeGen group:
      # with optional: true a MISSING group is skipped entirely (SourceGenerator.swift:742), so a build without the
      # APK still succeeds; a plain optional file would leave a dangling build-phase input. Its one file lands flat
      # at Contents/Resources/DaylightInk.apk, which is where the app serves /daylight-ink.apk from.
      - path: Daylight/Resources/Apk
        optional: true
        buildPhase: resources
    dependencies:
      - target: DaylightCameraExtension
      - package: DaylightKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twelve.daylight
        PRODUCT_NAME: Daylight
        CODE_SIGN_IDENTITY: ${DAYLIGHT_CODE_SIGN_IDENTITY}
        PROVISIONING_PROFILE_SPECIFIER: ${DAYLIGHT_APP_PROFILE}
    info:
      path: Daylight/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Daylight
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.video
        NSCameraUsageDescription: Daylight shows your webcam in the Daylight Camera.
        NSSystemExtensionUsageDescription: Daylight installs a camera extension that publishes the Daylight Camera.
        NSLocalNetworkUsageDescription: Daylight talks to your Daylight tablet on the local network.
        NSBonjourServices: [_daylight-camera._tcp]
        DaylightBuildSigned: false
        # LOOSE_ENDS H1 (8): "0" when make fetch-tools ran with DAYLIGHT_BUNDLE_ADB=0 (no Vendor/adb); the app then hides
        # Bundled in Settings > Mirror > adb source and uses Download on first use as the default.
        DaylightBundlesAdb: "${DAYLIGHT_BUNDLE_ADB}"
        DaylightCameraDeviceUUID: AB51C6BA-17FD-4A67-BE3A-06A8540BA6AA
        DaylightCameraSourceUUID: 8C5A2272-C779-469F-8439-BFE8BEBA229A
        DaylightCameraSinkUUID: 4B856AE3-B992-490B-8DC5-1F2A9475D6E7
    entitlements:
      path: Daylight/Daylight.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups: ["$(TeamIdentifierPrefix)com.twelve.daylight"]
        com.apple.security.device.camera: true
  DaylightCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: DaylightCameraExtension/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twelve.daylight.camera
        PRODUCT_NAME: com.twelve.daylight.camera
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: ${DAYLIGHT_CODE_SIGN_IDENTITY}
        PROVISIONING_PROFILE_SPECIFIER: ${DAYLIGHT_EXT_PROFILE}
    info:
      path: DaylightCameraExtension/Info.plist
      properties:
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Daylight Camera
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)com.twelve.daylight
        NSSystemExtensionUsageDescription: Publishes the Daylight Camera virtual camera.
        DaylightCameraDeviceUUID: AB51C6BA-17FD-4A67-BE3A-06A8540BA6AA
        DaylightCameraSourceUUID: 8C5A2272-C779-469F-8439-BFE8BEBA229A
        DaylightCameraSinkUUID: 4B856AE3-B992-490B-8DC5-1F2A9475D6E7
    entitlements:
      path: DaylightCameraExtension/DaylightCameraExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: ["$(TeamIdentifierPrefix)com.twelve.daylight"]
  DaylightTests:
    # macOS-only XCTest bundle hosted by Daylight.app (XcodeGen sets TEST_HOST and BUNDLE_LOADER because the
    # target depends on the application). Component folders: Pipeline, Server, Ink, App (B), Camera (C), Mirror (F).
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DaylightTests
      # Component C's pure extension rules (Foundation only) compile into the test bundle too, so SPEC C3's numbers are
      # asserted directly instead of by a source-text check (C handoff request 1).
      - path: DaylightCameraExtension/Sources/ExtensionRules.swift
    dependencies:
      - target: Daylight
      - package: DaylightKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twelve.daylight.tests
schemes:
  Daylight:
    build:
      targets:
        Daylight: all
        DaylightCameraExtension: all
    run:
      config: Debug
    archive:
      config: Release
  DaylightTests:
    build:
      targets:
        DaylightTests: all
    test:
      config: Debug
      targets:
        - DaylightTests
